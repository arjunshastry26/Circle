<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 520" width="950" height="520">
  <defs>
    <style>
      text { font-family: 'Segoe UI', Helvetica, Arial, sans-serif; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1D4ED8"/>
    </marker>
    <marker id="arrow-light" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#60A5FA"/>
    </marker>
  </defs>

  <text x="475" y="28" font-size="22" font-weight="700" fill="#1E3A8A" text-anchor="middle">Circle — Architecture</text>

  <!-- Client -->
  <rect x="375" y="55" width="200" height="55" rx="10" fill="#1E3A8A" stroke="#16306B" stroke-width="1.5"/>
  <text x="475" y="76" font-size="15" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Client App</text>
  <text x="475" y="92" font-size="11" fill="#DBEAFE" text-anchor="middle" dominant-baseline="central">OpenAI-compatible SDK</text>

  <line x1="475" y1="110" x2="475" y2="155" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Gateway -->
  <rect x="275" y="155" width="400" height="75" rx="10" fill="#2563EB" stroke="#1D4ED8" stroke-width="1.5"/>
  <text x="475" y="181" font-size="16" font-weight="700" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Gateway (FastAPI)</text>
  <text x="475" y="204" font-size="12" fill="#DBEAFE" text-anchor="middle" dominant-baseline="central">Auth · Rate Limit · Routing</text>

  <!-- Redis -->
  <rect x="800" y="165" width="140" height="55" rx="10" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="870" y="186" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">Redis</text>
  <text x="870" y="202" font-size="10" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">Rate limiting</text>
  <line x1="675" y1="192" x2="800" y2="192" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Postgres -->
  <rect x="800" y="245" width="140" height="55" rx="10" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1.5"/>
  <text x="870" y="266" font-size="14" font-weight="700" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">PostgreSQL</text>
  <text x="870" y="282" font-size="10" fill="#1E3A8A" text-anchor="middle" dominant-baseline="central">Usage ledger</text>
  <line x1="675" y1="215" x2="800" y2="272" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-light)"/>

  <!-- Gateway -> Adapters branch -->
  <line x1="475" y1="230" x2="475" y2="248" stroke="#1D4ED8" stroke-width="2"/>
  <line x1="255" y1="248" x2="695" y2="248" stroke="#1D4ED8" stroke-width="2"/>
  <line x1="255" y1="248" x2="255" y2="260" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="248" x2="475" y2="260" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="695" y1="248" x2="695" y2="260" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- normalized response merge, back up into gateway -->
  <line x1="495" y1="248" x2="495" y2="230" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-light)"/>
  <text x="505" y="239" font-size="10" font-style="italic" fill="#1D4ED8" text-anchor="start" dominant-baseline="central">normalized response (SSE)</text>

  <!-- Adapters row -->
  <rect x="165" y="260" width="180" height="60" rx="10" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5"/>
  <text x="255" y="290" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">OpenAI Adapter</text>

  <rect x="385" y="260" width="180" height="60" rx="10" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5"/>
  <text x="475" y="290" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Anthropic Adapter</text>

  <rect x="605" y="260" width="180" height="60" rx="10" fill="#3B82F6" stroke="#2563EB" stroke-width="1.5"/>
  <text x="695" y="290" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Groq Adapter</text>

  <!-- Adapters -> Providers -->
  <line x1="255" y1="320" x2="255" y2="375" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="475" y1="320" x2="475" y2="375" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="695" y1="320" x2="695" y2="375" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Providers row -->
  <rect x="165" y="375" width="180" height="60" rx="10" fill="#1E3A8A" stroke="#16306B" stroke-width="1.5"/>
  <text x="255" y="405" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">OpenAI API</text>

  <rect x="385" y="375" width="180" height="60" rx="10" fill="#1E3A8A" stroke="#16306B" stroke-width="1.5"/>
  <text x="475" y="405" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Anthropic API</text>

  <rect x="605" y="375" width="180" height="60" rx="10" fill="#1E3A8A" stroke="#16306B" stroke-width="1.5"/>
  <text x="695" y="405" font-size="14" font-weight="600" fill="#ffffff" text-anchor="middle" dominant-baseline="central">Groq API</text>

  <!-- Legend -->
  <rect x="200" y="447" width="16" height="16" rx="3" fill="#1E3A8A"/>
  <text x="222" y="455" font-size="11" fill="#1E293B" text-anchor="start" dominant-baseline="central">External (client / provider APIs)</text>

  <rect x="460" y="447" width="16" height="16" rx="3" fill="#2563EB"/>
  <text x="482" y="455" font-size="11" fill="#1E293B" text-anchor="start" dominant-baseline="central">Gateway &amp; adapters</text>

  <rect x="630" y="447" width="16" height="16" rx="3" fill="#DBEAFE" stroke="#60A5FA" stroke-width="1"/>
  <text x="652" y="455" font-size="11" fill="#1E293B" text-anchor="start" dominant-baseline="central">Infra (Redis / PostgreSQL)</text>

  <line x1="200" y1="487" x2="230" y2="487" stroke="#1D4ED8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="238" y="487" font-size="11" fill="#1E293B" text-anchor="start" dominant-baseline="central">Request</text>

  <line x1="340" y1="487" x2="370" y2="487" stroke="#60A5FA" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-light)"/>
  <text x="378" y="487" font-size="11" fill="#1E293B" text-anchor="start" dominant-baseline="central">Streamed / async response</text>
</svg>
